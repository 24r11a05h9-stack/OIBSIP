<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temperature Converter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="converter-card">
        <div class="header">
          <p class="eyebrow">Utility Tool</p>
          <h1>Temperature Converter</h1>
        </div>

        <div class="input-group">
          <label for="temperature">Temperature</label>
          <input id="temperature" type="number" step="any" placeholder="Enter value" />
        </div>

        <div class="selectors">
          <div class="input-group">
            <label for="fromUnit">From</label>
            <select id="fromUnit">
              <option value="celsius">Celsius (°C)</option>
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>

          <div class="input-group">
            <label for="toUnit">To</label>
            <select id="toUnit">
              <option value="fahrenheit">Fahrenheit (°F)</option>
              <option value="celsius" selected>Celsius (°C)</option>
              <option value="kelvin">Kelvin (K)</option>
            </select>
          </div>
        </div>

        <button id="convertBtn" type="button">Convert</button>

        <div class="result-box" aria-live="polite">
          <span class="result-label">Result</span>
          <div id="resultValue">0.00 °C</div>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
