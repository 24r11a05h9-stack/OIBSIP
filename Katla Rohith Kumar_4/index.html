<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <div class="calculator" aria-label="Calculator">
        <div class="display-screen" id="display" aria-live="polite">0</div>

        <div class="button-grid">
          <button class="btn control" data-action="clear" type="button">C</button>
          <button class="btn control" data-action="delete" type="button">⌫</button>
          <button class="btn operator" data-value="/" type="button">÷</button>
          <button class="btn operator" data-value="*" type="button">×</button>

          <button class="btn number" data-value="7" type="button">7</button>
          <button class="btn number" data-value="8" type="button">8</button>
          <button class="btn number" data-value="9" type="button">9</button>
          <button class="btn operator" data-value="-" type="button">−</button>

          <button class="btn number" data-value="4" type="button">4</button>
          <button class="btn number" data-value="5" type="button">5</button>
          <button class="btn number" data-value="6" type="button">6</button>
          <button class="btn operator" data-value="+" type="button">+</button>

          <button class="btn number" data-value="1" type="button">1</button>
          <button class="btn number" data-value="2" type="button">2</button>
          <button class="btn number" data-value="3" type="button">3</button>
          <button class="btn equals" data-action="equals" type="button">=</button>

          <button class="btn number zero" data-value="0" type="button">0</button>
          <button class="btn number" data-value="." type="button">.</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
